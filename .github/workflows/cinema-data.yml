# Builds cinema/data.json (the well-known films and film people behind Cinema's discovery page)
# from Wikidata, every Monday and whenever it's started by hand, and commits it if it changed.
name: Cinema data
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, early morning UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cinema-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cinema/data.json
        run: python3 tools/build_cinema_data.py
      - name: Commit if changed
        run: |
          git add cinema/data.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Cinema's discovery data from Wikidata"
          git push
